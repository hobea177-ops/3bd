<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
    body { margin: 0; background: #050505; color: #d4af37; overflow: hidden; font-family: sans-serif; }
    #bgCanvas { position: fixed; top: 0; left: 0; z-index: -1; }
    #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    .vinyl { width: 300px; height: 300px; border-radius: 50%; border: 10px solid #222; background: radial-gradient(circle, #333 10%, #000 90%); animation: spin 2s linear infinite; margin: 0 auto; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .spark { position: absolute; width: 4px; height: 4px; background: #ff0000; border-radius: 50%; pointer-events: none; }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="ui">
    <h1>عبد الرزاق العنيف</h1>
    <div class="vinyl"></div>
    <p>اضغط في أي مكان للإطلاق (صوت وشرارات)</p>
</div>

<audio id="gunShot" src="https://www.soundjay.com/mechanical/sounds/gun-gunshot-01.mp3"></audio>

<script>
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // إضاءة خلفية تفاعلية
    function animateBG() {
        ctx.fillStyle = 'rgba(0,0,0,0.05)';
        ctx.fillRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = `hsl(${Math.random()*360}, 100%, 50%)`;
        ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 3, 3);
        requestAnimationFrame(animateBG);
    }
    animateBG();

    // نظام الشرارات والإطلاق
    window.addEventListener('mousedown', (e) => {
        document.getElementById('gunShot').currentTime = 0;
        document.getElementById('gunShot').play();
        
        for(let i=0; i<30; i++) {
            const s = document.createElement('div');
            s.className = 'spark';
            s.style.left = e.clientX + 'px';
            s.style.top = e.clientY + 'px';
            document.body.appendChild(s);
            
            const dx = (Math.random()-0.5)*20;
            const dy = (Math.random()-0.5)*20;
            
            s.animate([
                { transform: 'translate(0,0)', opacity: 1 },
                { transform: `translate(${dx*10}px, ${dy*10}px)`, opacity: 0 }
            ], { duration: 500 }).onfinish = () => s.remove();
        }
    });
</script>
</body>
</html>
