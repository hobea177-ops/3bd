<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام عبد الرزاق العنيف 🔥</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
        #overlay { position: absolute; top: 20%; left: 0; width: 100%; text-align: center; pointer-events: none; z-index: 10; }
        h1 { color: #d4af37; font-size: 4em; text-shadow: 0 0 20px #ff0000; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .gun-point { position: absolute; width: 10px; height: 10px; background: red; border-radius: 50%; pointer-events: none; z-index: 100; }
    </style>
</head>
<body>

<div id="overlay">
    <h1>عبد الرزاق العنيف 🔥</h1>
    <p style="color:white;">اضغط في أي مكان للإطلاق.. النظام جاهز.</p>
</div>

<canvas id="c"></canvas>

<audio id="s" src="https://www.myinstants.com/media/sounds/shotgun.mp3"></audio>

<script>
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    c.width = window.innerWidth; c.height = window.innerHeight;

    // إضاءات الخلفية التفاعلية
    let particles = [];
    function draw() {
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.fillRect(0,0,c.width,c.height);
        
        // إضاءة متغيرة
        ctx.fillStyle = `hsl(${Math.random()*360}, 100%, 50%)`;
        ctx.fillRect(Math.random()*c.width, Math.random()*c.height, 2, 2);
        
        requestAnimationFrame(draw);
    }
    draw();

    // نظام إطلاق النار
    window.addEventListener('mousedown', (e) => {
        document.getElementById('s').play();
        const p = document.createElement('div');
        p.className = 'gun-point';
        p.style.left = e.clientX + 'px';
        p.style.top = e.clientY + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 200);
        
        // شرارات
        for(let i=0; i<20; i++) {
            ctx.beginPath();
            ctx.arc(e.clientX, e.clientY, 50, 0, Math.PI*2);
            ctx.strokeStyle = 'yellow';
            ctx.stroke();
        }
    });
</script>
</body>
</html>
